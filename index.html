<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-container container my-5">
        <!-- Search Section -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-10 col-lg-8 col-xl-6">
                <div class="search-box glass-panel p-2 d-flex align-items-center rounded-pill">
                    <i class="bi bi-search ms-3 text-muted"></i>
                    <input type="text" id="cityInput" class="form-control border-0 bg-transparent shadow-none" placeholder="Search for a city in India..." value="Mumbai, India">
                    <button id="searchBtn" class="btn btn-primary rounded-pill px-4 ms-2">Search</button>
                </div>
            </div>
        </div>

        <!-- Health Alert Section (Hidden by default) -->
        <div class="row justify-content-center mb-4 d-none" id="healthAlertContainer">
            <div class="col-md-10 col-lg-8 col-xl-6">
                <div id="healthAlert" class="alert health-alert d-flex align-items-center p-3 mb-0" role="alert">
                    <i id="alertIcon" class="bi bi-exclamation-triangle-fill fs-4 me-3 text-warning"></i>
                    <div>
                        <h6 id="alertHeading" class="alert-heading fw-bold mb-1">Health Suggestion</h6>
                        <p id="alertText" class="mb-0 small text-muted">Moderate AQI.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Weather Display -->
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-6 text-center">
                <div class="weather-card glass-panel p-4 p-md-5 rounded-4 position-relative overflow-hidden">
                    
                    <!-- Loading State -->
                    <div id="loadingState" class="d-none py-5">
                        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-3 text-muted fw-medium">Fetching weather data...</p>
                    </div>

                    <!-- Error State -->
                    <div id="errorState" class="d-none py-4">
                        <i class="bi bi-cloud-slash text-danger" style="font-size: 4rem;"></i>
                        <h4 class="mt-3 fw-bold text-dark">Oops!</h4>
                        <p id="errorText" class="text-muted">Could not find weather data for this location.</p>
                        <button id="retryBtn" class="btn btn-outline-primary rounded-pill mt-2 px-4">Try Again</button>
                    </div>

                    <!-- Weather Content -->
                    <div id="weatherContent">
                        <div class="location-header mb-4">
                            <h2 id="cityName" class="fw-bold mb-0">Mumbai, India</h2>
                            <p id="weatherDesc" class="text-muted mb-0">Partly Cloudy</p>
                        </div>
                        
                        <div class="temp-display mb-5">
                            <div class="d-flex justify-content-center align-items-center">
                                <i id="weatherIcon" class="bi bi-cloud-sun text-primary weather-icon me-3"></i>
                                <h1 id="currentTemp" class="display-1 fw-bold mb-0">31&deg;</h1>
                            </div>
                            <p id="highLowTemp" class="text-muted mt-2 fw-medium">H: 34&deg; &nbsp;&bull;&nbsp; L: 26&deg;</p>
                        </div>

                        <div class="row details-grid g-3 mt-2 text-start">
                            <!-- Humidity -->
                            <div class="col-12 col-sm-4">
                                <div class="detail-box p-3 rounded-4 h-100 d-flex flex-sm-column align-items-center align-items-sm-start justify-content-between">
                                    <div class="text-muted small mb-sm-2 d-flex align-items-center">
                                        <i class="bi bi-droplet-fill me-2 fs-5 text-info"></i>
                                        <span>Humidity</span>
                                    </div>
                                    <div id="humidityVal" class="fs-4 fw-bold">65%</div>
                                </div>
                            </div>
                            <!-- AQI -->
                            <div class="col-12 col-sm-4">
                                <div class="detail-box p-3 rounded-4 h-100 d-flex flex-sm-column align-items-center align-items-sm-start justify-content-between">
                                    <div class="text-muted small mb-sm-2 d-flex align-items-center">
                                        <i class="bi bi-wind me-2 fs-5 text-secondary"></i>
                                        <span>AQI</span>
                                    </div>
                                    <div class="fs-4 fw-bold d-flex align-items-center">
                                        <span id="aqiVal">142</span> 
                                        <span id="aqiBadge" class="badge bg-warning text-dark rounded-pill px-2 py-1 ms-2 fs-7 align-middle">Mod</span>
                                    </div>
                                </div>
                            </div>
                            <!-- UV Index -->
                            <div class="col-12 col-sm-4">
                                <div class="detail-box p-3 rounded-4 h-100 d-flex flex-sm-column align-items-center align-items-sm-start justify-content-between">
                                    <div class="text-muted small mb-sm-2 d-flex align-items-center">
                                        <i class="bi bi-brightness-high-fill me-2 fs-5 text-warning"></i>
                                        <span>UV Index</span>
                                    </div>
                                    <div class="fs-4 fw-bold d-flex align-items-center">
                                        <span id="uvVal">8</span> 
                                        <span id="uvBadge" class="badge bg-danger rounded-pill px-2 py-1 ms-2 fs-7 align-middle text-white">High</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
